<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finans Takip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="ust-bar">
    <h1>Finans Takip</h1>
  </header>

  <main>

    <!-- ======================= ÖZET SEKMESİ ======================= -->
    <section id="sayfa-ozet" class="sayfa">

      <p id="bildirim" class="bildirim gizli"></p>

      <!-- Tüm zamanların toplamı. Ay seçiminden bağımsız. -->
      <div class="varlik">
        <span class="varlik-etiket">Toplam varlık</span>
        <strong id="varlik-tutar" class="varlik-tutar">0,00 ₺</strong>
        <span id="varlik-alt" class="varlik-alt"></span>
      </div>

      <!-- Ay okları Adım 5'te bu başlığın yanına gelecek. -->
      <h2 id="ay-basligi" class="ay-basligi">—</h2>

      <div class="kartlar">
        <div class="kart kart-gelir-renk">
          <span class="kart-etiket">Gelir</span>
          <strong id="kart-gelir" class="kart-tutar">0,00 ₺</strong>
        </div>
        <div class="kart kart-gider-renk">
          <span class="kart-etiket">Gider</span>
          <strong id="kart-gider" class="kart-tutar">0,00 ₺</strong>
        </div>
        <div class="kart kart-yatirim-renk">
          <span class="kart-etiket">Yatırım</span>
          <strong id="kart-yatirim" class="kart-tutar">0,00 ₺</strong>
        </div>
        <div class="kart kart-kalan-renk">
          <span class="kart-etiket">Bu ay kalan</span>
          <strong id="kart-kalan" class="kart-tutar">0,00 ₺</strong>
        </div>
      </div>

      <p id="ay-bos" class="ay-bos gizli">Bu ayda henüz kayıt yok.</p>

      <!-- Kayıt listesi Adım 5'te buraya gelecek. -->

    </section>

    <!-- ======================= EKLE SEKMESİ ======================= -->
    <section id="sayfa-ekle" class="sayfa gizli">
      <form id="ekle-formu">

        <!-- Tür seçimi. Görünüşte üç düğme, aslında üç radyo kutusu:
             radyo kutularının aynı name'i olduğu için sadece biri seçili
             kalabiliyor. Kutuları CSS ile saklayıp yanlarındaki yazıyı
             düğme gibi boyuyoruz. -->
        <div class="tur-secim">
          <label>
            <input type="radio" name="tur" value="gelir" checked>
            <span>Gelir</span>
          </label>
          <label>
            <input type="radio" name="tur" value="gider">
            <span>Gider</span>
          </label>
          <label>
            <input type="radio" name="tur" value="yatirim">
            <span>Yatırım</span>
          </label>
        </div>

        <label class="alan">
          <span class="etiket">Tutar (₺)</span>
          <!-- inputmode="decimal": telefonda sayı klavyesi açılır.
               type="text" bıraktık ki "1250,50" gibi virgüllü yazı da
               kabul edilsin — çevirmeyi kendi tlToKurus fonksiyonumuz yapıyor. -->
          <input id="alan-tutar" type="text" inputmode="decimal"
                 autocomplete="off" placeholder="0,00">
        </label>

        <label class="alan">
          <span class="etiket">Tarih</span>
          <!-- type="date": telefonda takvim açar, değeri 2026-08-06 biçiminde
               verir — tam bizim sakladığımız biçim. -->
          <input id="alan-tarih" type="date">
        </label>

        <!-- Bu kutu sadece "Gider" seçilince görünür (app.js yönetiyor). -->
        <label class="alan gizli" id="kutu-kategori">
          <span class="etiket">Kategori</span>
          <select id="alan-kategori"></select>
        </label>

        <label class="alan">
          <span class="etiket">Açıklama</span>
          <input id="alan-aciklama" type="text" maxlength="60"
                 autocomplete="off" placeholder="örn. Market alışverişi">
        </label>

        <p id="form-hata" class="hata gizli"></p>

        <button type="submit" class="kaydet">Kaydet</button>
      </form>
    </section>

  </main>

  <!-- Alt çubuk: telefonda başparmağın rahat ulaştığı yer. -->
  <nav class="alt-bar">
    <button type="button" class="sekme" data-sekme="ozet">Özet</button>
    <button type="button" class="sekme" data-sekme="ekle">Ekle</button>
  </nav>

  <!-- SIRA ÖNEMLİ: veri.js önce yüklenmeli, çünkü app.js onun
       fonksiyonlarını (kayitEkle, ozetHesapla...) kullanıyor. -->
  <script src="veri.js"></script>
  <script src="app.js"></script>
</body>
</html>
